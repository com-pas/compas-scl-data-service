name: Build Project

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  prepare_runners:
    name: Prepare Runners
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.set_runners.outputs.runners }}
    steps:
      - id: set_runners
        ## TODO: multi-arch native image builds on pull requests + push to main, otherwise only build
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo 'runners={"include":[{"name":"Build Native Image (amd64)","runner":"ubuntu-26.04"},{"name":"Build Native Image (arm64)","runner":"ubuntu-26.04-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'runners={"include":[{"name":"Build","runner":"ubuntu-26.04"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare_runners
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_runners.outputs.runners) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Cache Docker Register
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ matrix.runner }}-buildx-${{ hashFiles('**/Dockerfile') }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'

      - name: Set Docker API version
        # Workaround for Docker 29.x incompatibility with Testcontainers/EmbeddedPostgres.
        # See: https://github.com/testcontainers/testcontainers-java/issues/11212
        # This forces the Docker Java client to use API version 1.44, which is compatible with current Testcontainers/EmbeddedPostgres.
        run: |
          echo "api.version=1.44" > $HOME/.docker-java.properties

      - name: Create custom Maven Settings.xml
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          path: custom_maven_settings.xml
          githubServer: false
          servers: '[{ "id": "github-packages-compas", "username": "OWNER", "password": "${{ secrets.GITHUB_TOKEN }}" }]'
      # - name: Build with Maven (Pull Request)
      #   if: ${{ github.event_name == 'pull_request' }}
      #   run: ./mvnw -s custom_maven_settings.xml -B -Pnative-image clean verify
      - name: Build with Maven (Push)
        if: ${{ github.event_name == 'push' }}
        run: ./mvnw -s custom_maven_settings.xml -B -Pnative-image clean verify

      # TODO: remove
      - name: Show build results
        run: |
          ls -lh ./app/target/postgresql-quarkus-app/*-runner
          docker image ls lfenergy/compas-scl-data-service

          TAG=$(./mvnw -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)-postgresql
          echo "Image = lfenergy/compas-scl-data-service:$TAG"
          docker image inspect lfenergy/compas-scl-data-service:$TAG

          file ./app/target/postgresql-quarkus-app/*-runner
