on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

name: release-please

jobs:
  release_please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      
      - name: Cache Docker Register
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile') }}

      - name: Set up JDK 17
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'
      - name: Set up Docker Buildx
        if: ${{ steps.release.outputs.release_created }}
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set Docker API version
        if: ${{ steps.release.outputs.release_created }}
        # Workaround for Docker 29.x incompatibility with Testcontainers/EmbeddedPostgres.
        # See: https://github.com/testcontainers/testcontainers-java/issues/11212
        # This forces the Docker Java client to use API version 1.44, which is compatible with current Testcontainers/EmbeddedPostgres.
        run: |
          echo "api.version=1.44" > $HOME/.docker-java.properties
          
      - name: Install Cosign
        if: ${{ steps.release.outputs.release_created }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Create custom Maven Settings.xml
        if: ${{ steps.release.outputs.release_created }}
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          path: custom_maven_settings.xml
          githubServer: false
          servers: '[{ "id": "github-packages-compas", "username": "OWNER", "password": "${{ secrets.GITHUB_TOKEN }}" }]'
      - name: Deploy with Maven to GitHub Packages and Docker Hub
        if: ${{ steps.release.outputs.release_created }}
        run: ./mvnw -B -s custom_maven_settings.xml -Pjvm-image,release clean deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sign Docker image with Cosign
        if: ${{ steps.release.outputs.release_created }}
        run: |
          DIGEST=$(docker buildx imagetools inspect lfenergy/compas-scl-data-service:${{ steps.release.outputs.version }}-postgresql --format '{{.Manifest.Digest}}')
          cosign sign --yes lfenergy/compas-scl-data-service@${DIGEST}
