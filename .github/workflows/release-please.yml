on:
  push:
    branches:
      # - main
      - feature/added_compression_level

# permissions:
#   contents: write
#   id-token: write
#   packages: write
#   pull-requests: write
permissions:
  contents: read
  packages: read
  id-token: write

name: release-please

jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # - name: Create release
      #   id: release
      #   uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      #   with:
      #     target-branch: main
      #     token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set temporary release outputs for testing
        id: release
        run: |
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-$(echo ${GITHUB_SHA} | cut -c1-8)-SNAPSHOT" >> "$GITHUB_OUTPUT"

  release:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    name: Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # TODO: remove overrides
      # IMAGE=lfenergy/compas-scl-data-service
      IMAGE: compasacr.azurecr.io/compas/compas-scl-data-service
      TAG: ${{ needs.release_please.outputs.version }}-postgresql
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Cache Docker Register
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ matrix.runner }}-buildx-${{ hashFiles('**/Dockerfile') }}

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # - name: Login to Docker Hub
      #   uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      #   with:
      #     username: ${{ secrets.DOCKER_HUB_USERNAME }}
      #     password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Login to Azure Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: compasacr.azurecr.io
          username: ${{ secrets.BP_AZURECR_USERNAME }}
          password: ${{ secrets.BP_AZURECR_TOKEN }}

      - name: Set Docker API version
        # Workaround for Docker 29.x incompatibility with Testcontainers/EmbeddedPostgres.
        # See: https://github.com/testcontainers/testcontainers-java/issues/11212
        # This forces the Docker Java client to use API version 1.44, which is compatible with current Testcontainers/EmbeddedPostgres.
        run: |
          echo "api.version=1.44" > $HOME/.docker-java.properties

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create custom Maven Settings.xml
        uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          path: custom_maven_settings.xml
          githubServer: false
          servers: '[{ "id": "github-packages-compas", "username": "OWNER", "password": "${{ secrets.GITHUB_TOKEN }}" }]'

      - name: Prepare project version
        run: |
          echo "on branch ${{ github.event.ref }}, changing the version number to ${{ needs.release_please.outputs.version }}"
          ./mvnw --batch-mode --errors --show-version versions:set -DnewVersion=${{ needs.release_please.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true
          ./mvnw -B -q -N help:evaluate -Dexpression=project.version -DforceStdout

      # TODO: remove overrides
      - name: Build native image with Maven
        run: |
          ./mvnw -B -s custom_maven_settings.xml -Pnative-image,release \
            -Dquarkus.container-image.registry=compasacr.azurecr.io \
            -Dquarkus.container-image.group=compas \
            -Dquarkus.container-image.name=compas-scl-data-service \
            clean verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Publish GitHub Packages
      #   if: ${{ matrix.arch == 'amd64' }}
      #   run: ./mvnw -B -s custom_maven_settings.xml -DskipTests deploy
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TODO: remove
      - name: Show build results
        run: |
          ls -lh ./app/target/postgresql-quarkus-app/*-runner
          docker image ls "$IMAGE"

          echo "Image = $IMAGE:$TAG"
          docker image inspect "$IMAGE:$TAG"

          file ./app/target/postgresql-quarkus-app/*-runner

      # TODO: remove overrides
      - name: Publish image by digest (tagless) and sign with Cosign
        run: |
          skopeo copy --format oci --digestfile "$RUNNER_TEMP/${{ matrix.arch }}.digest" \
            "docker-daemon:$IMAGE:$TAG" \
            "docker://${IMAGE}@@unknown-digest@@"

          DIGEST=$(<"$RUNNER_TEMP/${{ matrix.arch }}.digest")
          cosign sign --yes "$IMAGE@$DIGEST"

          echo "Published and signed $IMAGE@$DIGEST"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.digest
          if-no-files-found: error

  merge_manifest:
    needs: [ release_please, release ]
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    env:
      # TODO: remove overrides
      # IMAGE: lfenergy/compas-scl-data-service
      IMAGE: compasacr.azurecr.io/compas/compas-scl-data-service
      TAG: ${{ needs.release_please.outputs.version }}-postgresql
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # - name: Login to Docker Hub
      #   uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      #   with:
      #     username: ${{ secrets.DOCKER_HUB_USERNAME }}
      #     password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Login to Azure Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: compasacr.azurecr.io
          username: ${{ secrets.BP_AZURECR_USERNAME }}
          password: ${{ secrets.BP_AZURECR_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish and sign multi-arch manifest
        run: |
          test -s "$RUNNER_TEMP/digests/amd64.digest"
          test -s "$RUNNER_TEMP/digests/arm64.digest"

          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest-postgresql" \
            "$IMAGE@$(<"$RUNNER_TEMP/digests/amd64.digest")" \
            "$IMAGE@$(<"$RUNNER_TEMP/digests/arm64.digest")"

          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          cosign sign --yes "$IMAGE@$DIGEST"

          echo "Published and signed multi-arch manifest as $IMAGE:$TAG and $IMAGE:latest-postgresql"
