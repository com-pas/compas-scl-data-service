on:
  push:
    branches:
      # - main
      - feature/added_compression_level

# permissions:
#   contents: write
#   id-token: write
#   packages: write
#   pull-requests: write
permissions:
  contents: read
  packages: read
  id-token: write

name: release-please

jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # - name: Create release
      #   id: release
      #   uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      #   with:
      #     target-branch: main
      #     token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set temporary release outputs for testing
        id: release
        run: |
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-$(echo ${{ github.sha }} | cut -c1-8)-SNAPSHOT" >> "$GITHUB_OUTPUT"

  release:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    name: Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # TODO: remove overrides
      # IMAGE=lfenergy/compas-scl-data-service
      IMAGE: compasacr.azurecr.io/compas/compas-scl-data-service
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # - name: Login to Docker Hub
      #   uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      #   with:
      #     username: ${{ secrets.DOCKER_HUB_USERNAME }}
      #     password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Login to Azure Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: compasacr.azurecr.io
          username: ${{ secrets.BP_AZURECR_USERNAME }}
          password: ${{ secrets.BP_AZURECR_TOKEN }}

      - name: Set Docker API version
        # Workaround for Docker 29.x incompatibility with Testcontainers/EmbeddedPostgres.
        # See: https://github.com/testcontainers/testcontainers-java/issues/11212
        # This forces the Docker Java client to use API version 1.44, which is compatible with current Testcontainers/EmbeddedPostgres.
        run: |
          echo "api.version=1.44" > $HOME/.docker-java.properties

      - name: Create custom Maven Settings.xml
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          path: custom_maven_settings.xml
          githubServer: false
          servers: '[{ "id": "github-packages-compas", "username": "OWNER", "password": "${{ secrets.GITHUB_TOKEN }}" }]'

      - name: Prepare project version
        run: |
          echo "on branch ${{ github.event.ref }}, changing the version number to ${{ needs.release_please.outputs.version }}"
          ./mvnw --batch-mode --errors --show-version versions:set -DnewVersion=${{ needs.release_please.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true
          ./mvnw -B -q -N help:evaluate -Dexpression=project.version -DforceStdout

      # TODO: remove overrides and add deploy
      - name: Build native image with Maven
        run: |
          ./mvnw -B -s custom_maven_settings.xml -Pnative-image,release \
            -Dquarkus.container-image.registry=compasacr.azurecr.io \
            -Dquarkus.container-image.group=compas \
            -Dquarkus.container-image.name=compas-scl-data-service \
            -Dquarkus.docker.buildx.platform=linux/${{ matrix.arch }} \
            clean ${{ matrix.arch == 'amd64' && 'package' || 'verify' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Publish GitHub Packages
      #   if: ${{ matrix.arch == 'amd64' }}
      #   run: ./mvnw -B -s custom_maven_settings.xml -Prelease -DskipTests deploy
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image by digest (tagless)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          file: ./app/src/main/docker/Dockerfile-postgresql.native
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        run: |
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/linux-${{ matrix.arch }}.digest"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  merge_manifest:
    needs: [ release_please, release ]
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    env:
      # TODO: remove overrides
      # IMAGE: lfenergy/compas-scl-data-service
      IMAGE: compasacr.azurecr.io/compas/compas-scl-data-service
      TAG: ${{ needs.release_please.outputs.version }}-postgresql
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # - name: Login to Docker Hub
      #   uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      #   with:
      #     username: ${{ secrets.DOCKER_HUB_USERNAME }}
      #     password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Login to Azure Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: compasacr.azurecr.io
          username: ${{ secrets.BP_AZURECR_USERNAME }}
          password: ${{ secrets.BP_AZURECR_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish and sign multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          AMD64_DIGEST=$(cat linux-amd64.digest)
          ARM64_DIGEST=$(cat linux-arm64.digest)

          docker buildx imagetools create \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest-postgresql" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"

          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          cosign sign --recursive --yes "$IMAGE@$DIGEST"

          echo "Published and signed multi-arch manifest as $IMAGE:$TAG and $IMAGE:latest-postgresql"
