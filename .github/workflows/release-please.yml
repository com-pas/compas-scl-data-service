on:
  push:
    branches:
      - main

name: release-please

jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    name: Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: lfenergy/compas-scl-data-service
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set Docker API version
        # Workaround for Docker 29.x incompatibility with Testcontainers/EmbeddedPostgres.
        # See: https://github.com/testcontainers/testcontainers-java/issues/11212
        # This forces the Docker Java client to use API version 1.44, which is compatible with current Testcontainers/EmbeddedPostgres.
        run: |
          echo "api.version=1.44" > $HOME/.docker-java.properties

      - name: Create custom Maven Settings.xml
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          path: custom_maven_settings.xml
          githubServer: false
          servers: '[{ "id": "github-packages-compas", "username": "OWNER", "password": "${{ secrets.GITHUB_TOKEN }}" }]'

      - name: Build native docker image with Maven and publish GitHub packages
        run: |
          ./mvnw -B -s custom_maven_settings.xml -Pnative-image,release \
            -Dquarkus.docker.buildx.platform=linux/${{ matrix.arch }} \
            clean ${{ matrix.arch == 'amd64' && 'deploy' || 'verify' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image to Docker Hub by digest (tagless)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          file: ./app/src/main/docker/Dockerfile-postgresql.native
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export docker image digest
        run: |
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/linux-${{ matrix.arch }}.digest"

      - name: Upload docker image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  merge_manifest:
    needs: [ release_please, release ]
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      IMAGE: lfenergy/compas-scl-data-service
      TAG: ${{ needs.release_please.outputs.version }}-postgresql
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Publish and sign multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          AMD64_DIGEST=$(cat linux-amd64.digest)
          ARM64_DIGEST=$(cat linux-arm64.digest)

          docker buildx imagetools create \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest-postgresql" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"

          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          cosign sign --recursive --yes "$IMAGE@$DIGEST"

          echo "Published and signed multi-arch manifest as $IMAGE:$TAG and $IMAGE:latest-postgresql"
